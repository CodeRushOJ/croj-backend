name: Backend production image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .trivyignore.yaml
      - pom.xml
      - README.md
      - CHANGELOG.md
      - .mvn/**
      - mvnw
      - scripts/project-version.sh
      - src/**
      - tests/container/**
      - tests/integration/**
      - .github/workflows/image.yml
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-tests:
    name: Java 17 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Restore Maven cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/maven
          key: backend-java17-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            backend-java17-${{ runner.os }}-

      - name: Run the complete Maven suite on Java 17
        run: |
          mkdir -p .cache/maven
          docker run --rm \
            --volume "$PWD:/workspace" \
            --volume "$PWD/.cache/maven:/root/.m2" \
            --workdir /workspace \
            maven:3.9-eclipse-temurin-17@sha256:1ed5d1f54416b706707b4f3238f63a20bb06aab27c6d240090a2bb9ad895ed45 \
            ./mvnw --batch-mode --no-transfer-progress \
              -Dmaven.repo.local=/root/.m2/repository test

      - name: Upload Surefire reports after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-surefire-${{ github.sha }}
          path: target/surefire-reports/**
          if-no-files-found: warn

  production-image:
    name: Build, inspect, SBOM, and scan
    needs: java-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate shell and static container contracts
        run: |
          shellcheck scripts/project-version.sh tests/container/*.sh tests/integration/*.sh
          tests/container/production-image-contract.sh

      - name: Verify pinned base indexes support amd64 and arm64
        env:
          BUILDER_BASE: maven:3.9-eclipse-temurin-17@sha256:1ed5d1f54416b706707b4f3238f63a20bb06aab27c6d240090a2bb9ad895ed45
          RUNTIME_BASE: gcr.io/distroless/java17-debian13:nonroot@sha256:81d09cac6ec47f6a13c61a941557f95079213320f3ddbf9d353de9317669aab5
        run: |
          for image in "$BUILDER_BASE" "$RUNTIME_BASE"; do
            manifest="$(docker buildx imagetools inspect --raw "$image")"
            printf '%s\n' "$image"
            jq -r '.manifests[]?.platform | select(.os != "unknown") | "  \(.os)/\(.architecture)"' <<<"$manifest"
            jq -e '
              ([.manifests[]?.platform | "\(.os)/\(.architecture)"] | index("linux/amd64")) != null and
              ([.manifests[]?.platform | "\(.os)/\(.architecture)"] | index("linux/arm64")) != null
            ' <<<"$manifest" >/dev/null
          done

      - name: Derive immutable image metadata
        id: metadata
        run: |
          POM_VERSION="$(scripts/project-version.sh)"
          printf 'created=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          printf 'version=v%s\n' "$POM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build inspection image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: coderushoj/croj-backend:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect stopped image root filesystem
        run: tests/container/inspect-production-image.sh "coderushoj/croj-backend:${GITHUB_SHA}"

      - name: Run production bootstrap against MySQL 8.4
        run: tests/integration/admin-bootstrap-mysql84.sh "coderushoj/croj-backend:${GITHUB_SHA}"

      - name: Produce attested OCI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          outputs: type=oci,dest=${{ runner.temp }}/croj-backend.oci.tar
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Upload attested OCI image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-oci-${{ github.sha }}
          path: ${{ runner.temp }}/croj-backend.oci.tar
          if-no-files-found: error
          retention-days: 7

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: coderushoj/croj-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coderushoj/croj-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coderushoj/croj-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  publish-image:
    name: Publish attested release image
    if: ${{ github.ref_type == 'tag' }}
    needs: production-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the complete tag history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify annotated SemVer release tag
        run: |
          POM_VERSION="$(scripts/project-version.sh)"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$POM_VERSION"
          git rev-parse "$GITHUB_REF_NAME^{tag}" >/dev/null
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Derive immutable image metadata
        id: metadata
        run: printf 'created=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-architecture image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/coderushoj/croj-backend:${{ github.ref_name }}
            ghcr.io/coderushoj/croj-backend:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance with GitHub OIDC
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/coderushoj/croj-backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image manifest
        env:
          IMAGE_REPOSITORY: ghcr.io/coderushoj/croj-backend
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test "${IMAGE_DIGEST#sha256:}" != "$IMAGE_DIGEST"
          jq -n \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            --arg revision "$IMAGE_REVISION" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson platforms '["linux/amd64","linux/arm64"]' \
            '{repository:$repository,tag:$tag,revision:$revision,digest:$digest,platforms:$platforms}' \
            > backend-image.json

      - name: Upload immutable image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-${{ github.sha }}
          path: backend-image.json
          if-no-files-found: error
