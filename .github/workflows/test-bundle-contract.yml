name: TestBundle consumer contract

on:
  pull_request:
    paths:
      - .github/workflows/test-bundle-contract.yml
      - .mvn/**
      - mvnw
      - pom.xml
      - scripts/verify-test-bundle-contract.sh
      - src/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-bundle-contract.yml
      - .mvn/**
      - mvnw
      - pom.xml
      - scripts/verify-test-bundle-contract.sh
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-bundle-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judging-consumer:
    name: Backend producer to Judging a12f052
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Backend
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check out the pinned Judging consumer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: CodeRushOJ/croj-judging-server
          ref: a12f05292ab2e2f0aa085f1ebcdc2bab61bc4faf
          path: .contract/judging

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.3
          cache: false

      - name: Restore Maven and Go caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.m2/repository
            .cache/go-build
          key: test-bundle-contract-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties', '.contract/judging/go.sum') }}
          restore-keys: |
            test-bundle-contract-${{ runner.os }}-

      - name: Validate and run the cross-repository contract
        env:
          JUDGING_REPOSITORY: ${{ github.workspace }}/.contract/judging
        run: |
          shellcheck scripts/verify-test-bundle-contract.sh
          scripts/verify-test-bundle-contract.sh
