server:
  port: 7999
  servlet:
    context-path: /api
spring:
  application:
    name: coderush-oj
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Keep JDBC sessions on the same UTC timeline as Java Instant and MySQL CURRENT_TIMESTAMP.
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/code_rush_oj?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false}
    username: ${DATABASE_USERNAME:coderushoj}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    protocol: smtp
    default-encoding: UTF-8
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          connectiontimeout: ${app.smtp.connection-timeout-millis}
          timeout: ${app.smtp.read-timeout-millis}
          writetimeout: ${app.smtp.write-timeout-millis}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS:false}
          ssl:
            enable: ${SMTP_SSL:false}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${IMPORT_MAX_FILE_SIZE:256MB}
      max-request-size: ${IMPORT_MAX_REQUEST_SIZE:260MB}
      file-size-threshold: 2KB

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.zephyr.croj.model.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.zephyr.croj: info
    org.springframework: warn

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 24h
  header: Authorization
  tokenPrefix: Bearer

# Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /**

# Application specific configuration
# Add these properties to your application.yml file

# File storage configuration
app:
  smtp:
    connection-timeout-millis: ${SMTP_CONNECTION_TIMEOUT_MS:3000}
    read-timeout-millis: ${SMTP_READ_TIMEOUT_MS:5000}
    write-timeout-millis: ${SMTP_WRITE_TIMEOUT_MS:5000}
  test-bundle:
    enabled: ${TEST_BUNDLE_STORAGE_ENABLED:false}
    bucket: ${TEST_BUNDLE_S3_BUCKET:coderushoj-test-bundles}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${TEST_BUNDLE_S3_ENDPOINT:}
    path-style: ${TEST_BUNDLE_S3_PATH_STYLE:true}
    max-archive-bytes: ${TEST_BUNDLE_MAX_ARCHIVE_BYTES:268435456}
    max-manifest-bytes: ${TEST_BUNDLE_MAX_MANIFEST_BYTES:1048576}
    max-case-bytes: ${TEST_BUNDLE_MAX_CASE_BYTES:66060288}
    max-uncompressed-bytes: ${TEST_BUNDLE_MAX_UNCOMPRESSED_BYTES:66060288}
    max-cases: ${TEST_BUNDLE_MAX_CASES:256}
    max-compression-ratio: ${TEST_BUNDLE_MAX_COMPRESSION_RATIO:200}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    submission-topic: ${SUBMISSION_TOPIC:submission-topic}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT1S}
    claim-timeout: ${OUTBOX_CLAIM_TIMEOUT:PT30S}
    publish-timeout: ${OUTBOX_PUBLISH_TIMEOUT:PT5S}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allow-credentials: true
  judge-result:
    service-token: ${JUDGE_RESULT_SERVICE_TOKEN}
  upload:
    # Base directory for file uploads (absolute path)
    base-dir: ${FILE_UPLOAD_DIR:uploads}
    # Maximum file size (matches Spring's multipart config)
    max-file-size: 2MB
    # Avatar specific settings
    avatar:
      dir: avatar
      # URL path where avatars can be accessed
      url-path: /uploads/avatar
  frontend-url: http://localhost:3000

# RocketMQ config
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: submission-producer-group
  consumer:
    group: submission-consumer-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
